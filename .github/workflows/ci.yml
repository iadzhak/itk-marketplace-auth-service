name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
      - name: Sync dependencies
        run: uv sync
      - name: Run linter
        run: uv run ruff check src/ bin/
      - name: Check formatting
        run: uv run ruff format --check src/ bin/

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - run: echo "implement test job..."
